apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dhia-03/argocd-test.git
    targetRevision: main
    path: helm/nginx/nginx

    helm:
      valueFiles:
        - ../../../environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
